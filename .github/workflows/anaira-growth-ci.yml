name: Anaira AI Growth CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anaira-growth-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Build-time public placeholders only. Never use production credentials here.
      NEXT_PUBLIC_SUPABASE_URL: ""
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
      NEXT_PUBLIC_SITE_URL: https://graphics.anairapos.in
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Bootstrap a deterministic lockfile from this exact package.json.
      # The generated file is uploaded below so it can be reviewed and committed.
      - name: Generate dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Clean reproducible dependency install
        run: npm ci --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run static and regression verification
        run: npm run verify:all

      - name: Run production build
        run: npm run build

      - name: Upload generated dependency lockfile
        if: always() && hashFiles('package-lock.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: anaira-growth-engine-v6.124.7-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 14
